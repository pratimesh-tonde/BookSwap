spring.application.name=book-exchange-backend
server.port=8080

# ---------- MongoDB ----------
# Local: Compass wala default. Cloud: Atlas ka URI environment variable MONGODB_URI me daalo.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/book_exchange}
spring.data.mongodb.auto-index-creation=true

# ---------- JWT ----------
# Secret kam se kam 32 characters ka hona chahiye. Production me JWT_SECRET env variable use karo.
app.jwt.secret=${JWT_SECRET:change-this-secret-key-before-deploying-min-32-chars}
app.jwt.expiration-ms=86400000

# ---------- CORS (frontend ka URL, multiple ho to comma se alag karo) ----------
app.cors.origin=${CORS_ORIGIN:http://localhost:5173}

# ---------- Default admin (pehli baar start hone par ban jayega) ----------
app.admin.email=${ADMIN_EMAIL:admin@bookexchange.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}

# ---------- Image upload ----------
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---------- Email (optional) ----------
# MAIL_ENABLED=true karo aur neeche ki lines uncomment karke Gmail App Password daalo.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@bookexchange.local}
#spring.mail.host=smtp.gmail.com
#spring.mail.port=587
#spring.mail.username=${MAIL_USERNAME}
#spring.mail.password=${MAIL_PASSWORD}
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true

# Default generated password ka log band karne ke liye
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
